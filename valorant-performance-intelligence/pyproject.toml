[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valorant-performance-intelligence"
version = "1.0.0"
description = "End-to-End Valorant telemetry analytics, win prediction, and AI tactical coaching system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Engineer", email = "developer@internal" }
]
keywords = [
    "valorant",
    "machine-learning",
    "esports",
    "telemetry-analytics",
    "shap",
    "xgboost",
    "streamlit",
    "data-science"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0,<2.1.0",
    "pandas>=2.2.0,<3.0.0",
    "scipy>=1.12.0,<1.15.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "xgboost>=2.0.0,<2.2.0",
    "joblib>=1.3.0,<1.5.0",
    "shap>=0.44.0,<0.47.0",
    "matplotlib>=3.8.0,<3.10.0",
    "seaborn>=0.13.0,<0.14.0",
    "plotly>=5.19.0,<6.0.0",
    "streamlit>=1.32.0,<1.40.0",
    "pytest>=8.0.0,<8.4.0",
    "pydantic>=2.6.0,<3.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/username/valorant-performance-intelligence"
Repository = "https://github.com/username/valorant-performance-intelligence"
Documentation = "https://github.com/username/valorant-performance-intelligence#readme"
Issues = "https://github.com/username/valorant-performance-intelligence/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
